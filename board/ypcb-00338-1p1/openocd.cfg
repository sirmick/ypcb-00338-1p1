# OpenOCD for the YPCB-00338-1P1 through the Digilent JTAG-HS3. Used by litex_term's JTAG UART
# (`litex_term jtag --jtag-config=<this>`). The stock cpld/xilinx-xc7.cfg does not list the
# XC7K480T's IDCODE, so the tap is declared here. Kill hw_server first: one program owns the cable.
source [find interface/ftdi/digilent_jtag_hs3.cfg]
adapter speed 10000
transport select jtag
reset_config none
set _CHIPNAME xc7
jtag newtap $_CHIPNAME tap -irlen 6 -ignore-version -expected-id 0x03751093
